name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: SEO audit
        run: npm run audit

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy (SFTP)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp sshpass

      - name: Configure SSH known hosts
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          PORT="${SFTP_PORT:-22}"
          if [ -z "${SFTP_SSH_KEY:-}" ] && [ -z "${SFTP_PASSWORD:-}" ]; then
            echo "SFTP_SSH_KEY veya SFTP_PASSWORD secret'larından en az biri gerekli." >&2
            exit 1
          fi

          # Parola komut satırına yazılmaz. SSH anahtarı varsa anahtar; yoksa
          # sshpass -e (SSHPASS ortam değişkeni) üzerinden parola kullanılır.
          ssh_options="-a -x -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          connect_program="ssh $ssh_options"
          if [ -n "${SFTP_SSH_KEY:-}" ]; then
            key_file="$RUNNER_TEMP/sftp_key"
            printf '%s\n' "$SFTP_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
            ssh_options="$ssh_options -i $key_file -o IdentitiesOnly=yes -o BatchMode=yes"
            connect_program="ssh $ssh_options"
          else
            export SSHPASS="${SFTP_PASSWORD:-}"
            connect_program="sshpass -e ssh $ssh_options"
          fi

          lftp -u "$SFTP_USER", "sftp://$SFTP_HOST:$PORT" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            set sftp:connect-program '$connect_program';
            mirror -R --delete --parallel=4 --verbose dist/ \"$SFTP_REMOTE_DIR\";
            bye
          "
