version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    target-branch: main
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(actions)'
