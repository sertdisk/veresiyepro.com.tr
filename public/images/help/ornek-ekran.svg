<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Cari hesap ekranı örnek şeması</title>
  <desc id="diagramDesc">Cari kartının üst bölümünde bakiye rozetleri, alt bölümünde hareket listesi gösteren nötr bir arayüz şeması. Gerçek uygulama ekran görüntüsü değildir.</desc>

  <rect width="720" height="420" fill="#F8FAFC"/>
  <rect x="24" y="24" width="672" height="372" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Üst çubuk -->
  <rect x="24" y="24" width="672" height="56" rx="16" fill="#0B1E4B"/>
  <rect x="24" y="64" width="672" height="16" fill="#0B1E4B"/>
  <circle cx="56" cy="52" r="10" fill="#06B6D4"/>
  <rect x="78" y="45" width="150" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>

  <!-- Cari başlık -->
  <rect x="48" y="104" width="240" height="18" rx="9" fill="#0F172A"/>
  <rect x="48" y="132" width="160" height="10" rx="5" fill="#94A3B8"/>

  <!-- Bakiye rozetleri -->
  <rect x="48" y="164" width="150" height="64" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="64" y="180" width="70" height="9" rx="4.5" fill="#64748B"/>
  <rect x="64" y="197" width="100" height="16" rx="8" fill="#1D4ED8"/>

  <rect x="218" y="164" width="150" height="64" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
  <rect x="234" y="180" width="70" height="9" rx="4.5" fill="#64748B"/>
  <rect x="234" y="197" width="100" height="16" rx="8" fill="#10B981"/>

  <rect x="388" y="164" width="150" height="64" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <rect x="404" y="180" width="70" height="9" rx="4.5" fill="#64748B"/>
  <rect x="404" y="197" width="100" height="16" rx="8" fill="#EF4444"/>

  <!-- İşlem listesi -->
  <rect x="48" y="252" width="624" height="1" fill="#E2E8F0"/>

  <g fill="#E2E8F0">
    <circle cx="66" cy="284" r="9"/>
    <rect x="88" y="278" width="180" height="11" rx="5.5"/>
    <rect x="520" y="278" width="132" height="11" rx="5.5"/>
  </g>

  <g fill="#E2E8F0">
    <circle cx="66" cy="322" r="9"/>
    <rect x="88" y="316" width="150" height="11" rx="5.5"/>
    <rect x="520" y="316" width="132" height="11" rx="5.5"/>
  </g>

  <g fill="#E2E8F0">
    <circle cx="66" cy="360" r="9"/>
    <rect x="88" y="354" width="210" height="11" rx="5.5"/>
    <rect x="520" y="354" width="132" height="11" rx="5.5"/>
  </g>

  <text x="48" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">
    Nötr şema — gerçek uygulama ekran görüntüsü değildir.
  </text>
</svg>
